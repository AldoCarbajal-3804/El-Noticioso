# Nombre de la aplicación
spring.application.name=el-noticioso-backend
spring.config.import=optional:file:.env[.properties]

# Configuración de la Base de Datos (PostgreSQL en Supabase)
spring.datasource.url=${LINK_DATABASE}
spring.datasource.username=${USERNAME_DATABASE}
spring.datasource.password=${PASSWORD_DATABASE}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase Auth: validación de JWT (variables definidas en .env)
supabase.jwt.jwks-url=${SUPABASE_JWKS_URL}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080}